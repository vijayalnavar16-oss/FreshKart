services:
  - type: web
    name: freshkart
    runtime: python
    plan: free
    healthCheckPath: /healthz
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --preload app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRESHKART_ADMIN_USERNAME
        sync: false
      - key: FRESHKART_ADMIN_PASSWORD
        sync: false
      - key: UPI_ID
        value: 8296863406@ybl
