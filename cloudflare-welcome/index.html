<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b3a">
  <title>FreshKart | Fresh from Farmers</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #173b27; background: radial-gradient(circle at top, #f0fae9, #e1f2df 55%, #f8fbf5); }
    main { width: min(100%, 540px); text-align: center; background: rgba(255,255,255,.88); border: 1px solid #d8ead7; border-radius: 28px; padding: clamp(28px, 7vw, 52px); box-shadow: 0 22px 70px rgba(25, 83, 46, .12); }
    .logo { width: 76px; height: 76px; display: grid; place-items: center; margin: 0 auto 16px; border-radius: 24px; background: #e6f5e7; font-size: 40px; }
    h1 { margin: 0; color: #176b3a; font-size: clamp(34px, 8vw, 48px); letter-spacing: -1.8px; }
    .tag { margin: 8px 0 26px; color: #587362; font-weight: 600; }
    .produce { font-size: 34px; letter-spacing: 10px; margin: 20px 0; }
    .status { min-height: 28px; color: #315c40; font-weight: 600; }
    .track { height: 9px; margin: 18px 0 12px; border-radius: 99px; overflow: hidden; background: #e6efe5; }
    .bar { width: 35%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #7bc65b, #176b3a); animation: travel 1.5s ease-in-out infinite alternate; }
    @keyframes travel { from { transform: translateX(-5%); } to { transform: translateX(190%); } }
    .note { color: #718477; font-size: 13px; line-height: 1.6; }
    a { display: inline-block; margin-top: 22px; padding: 12px 22px; border-radius: 999px; background: #176b3a; color: white; text-decoration: none; font-weight: 700; }
    a:hover { background: #10552d; }
    @media (prefers-reduced-motion: reduce) { .bar { animation: none; width: 70%; } }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">🌿</div>
    <h1>FreshKart</h1>
    <p class="tag">Fresh vegetables, straight from farmers.</p>
    <div class="produce" aria-hidden="true">🥬 🥕 🍅</div>
    <p class="status" id="status" role="status" aria-live="polite">Waking up our farm-fresh market…</p>
    <div class="track" aria-hidden="true"><div class="bar"></div></div>
    <p class="note">This may take a little while when the market has been quiet.<br>Thank you for waiting!</p>
    <a id="open" href="https://freshkart-j9d1.onrender.com/">Open FreshKart</a>
  </main>
  <script>
    (() => {
      const backend = "https://freshkart-j9d1.onrender.com";
      const status = document.getElementById("status");
      const open = document.getElementById("open");
      open.href = backend + "/";
      let attempts = 0;
      const maxAttempts = 90;
      async function check() {
        attempts += 1;
        status.textContent = attempts < 3 ? "Connecting to FreshKart…" : "Getting the market ready…";
        try {
          const response = await fetch(backend + "/healthz?check=" + Date.now(), {
            method: "GET", cache: "no-store", mode: "cors"
          });
          if (response.ok) {
            const data = await response.json();
            if (data.status === "ok" && data.service === "freshkart") {
              status.textContent = "FreshKart is ready. Taking you to the market…";
              window.location.replace(backend + "/");
              return;
            }
          }
        } catch (_) {
          // The backend may still be starting; keep the branded page visible.
        }
        if (attempts >= maxAttempts) {
          status.textContent = "The market is taking longer than usual. You can try opening it below.";
          return;
        }
        window.setTimeout(check, 3000);
      }
      check();
    })();
  </script>
</body>
</html>
