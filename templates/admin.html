<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#183f2d"><title>FreshKart Admin</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#19392d;background:#f4f7ee}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:24px 16px 50px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:24px;font-weight:800;color:#183f2d;text-decoration:none}.brand span{color:#8b63a8}.panel{background:#fff;border:1px solid #e0e7db;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 8px 25px #183f2d0a}h1{font-size:26px;margin:0 0 6px}h2{font-size:19px;margin:0 0 16px}.muted{color:#718071;font-size:14px}form.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:grid;gap:6px;font-size:13px;font-weight:650}input,select,textarea{width:100%;padding:11px;border:1px solid #d8e1d4;border-radius:8px;background:white;font:inherit;color:inherit}textarea{min-height:78px;resize:vertical}.full{grid-column:1/-1}.btn{border:0;border-radius:8px;background:#20583d;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.btn.secondary{background:#e8eee2;color:#234331}.btn.danger{background:#a33434}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{margin:12px 0;padding:11px 13px;background:#e5f4e6;border-radius:8px;color:#205b30;font-size:14px}.error{background:#fbe9e8;color:#8a2727}.products{display:grid;gap:10px}.product{display:flex;justify-content:space-between;gap:16px;align-items:center;border:1px solid #e4e9df;border-radius:10px;padding:13px}.product strong{display:block}.product small{display:block;color:#718071;margin-top:4px}.empty{padding:18px;color:#718071;background:#f8faf5;border-radius:8px}@media(max-width:600px){form.grid{grid-template-columns:1fr}.full{grid-column:auto}.product{align-items:flex-start;flex-direction:column}.wrap{padding:18px 12px 40px}}
</style></head><body><div class="wrap">
<header><a class="brand" href="/">freshkart<span>.</span></a><span class="muted">Admin dashboard</span></header>
{% if login_mode %}
<section class="panel" style="max-width:460px;margin:8vh auto"><h1>Admin login</h1><p class="muted">Sign in to manage FreshKart produce.</p>
{% if error %}<div class="notice error">{{ error }}</div>{% endif %}
<form method="post" action="/admin/login" class="grid"><label class="full">Username<input name="username" autocomplete="username" required></label><label class="full">Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn full" type="submit">Sign in</button></form></section>
{% else %}
<section class="panel"><h1>Manage vegetables</h1><p class="muted">Add products, update prices and stock, or remove listings.</p>
<form id="product-form" class="grid"><input id="product-id" type="hidden">
<label>Vegetable / product name<input id="name" required maxlength="120" placeholder="e.g. Tomato"></label>
<label>Category<select id="category" required><option>Vegetables</option><option>Fruits</option><option>Leafy greens</option><option>Root vegetables</option><option>Other</option></select></label>
<label>Price (₹)<input id="price" type="number" min="0" step="0.01" required placeholder="30"></label>
<label>Available stock<input id="stock" type="number" min="0" step="1" required placeholder="50"></label>
<label>Unit<select id="unit" required><option value="kg">kg</option><option value="500 g">500 g</option><option value="piece">piece</option><option value="bunch">bunch</option><option value="dozen">dozen</option></select></label>
<label>Listing status<select id="available"><option value="true">Available</option><option value="false">Hidden / unavailable</option></select></label>
<label class="full">Description<textarea id="description" maxlength="500" placeholder="Fresh farm-grown produce"></textarea></label>
<label class="full">Image URL (optional)<input id="image" type="url" placeholder="https://example.com/tomatoes.jpg"></label>
<div class="full actions"><button class="btn" id="save-button" type="submit">Add vegetable</button><button class="btn secondary" id="cancel-edit" type="button" hidden>Cancel edit</button></div></form><div id="message" aria-live="polite"></div></section>
<section class="panel"><h2>Current listings</h2><div id="products" class="products"><div class="empty">Loading products…</div></div></section>
<form method="post" action="/admin/logout"><button class="btn secondary" type="submit">Log out</button></form>
<script>
const form=document.querySelector('#product-form'),message=document.querySelector('#message'),list=document.querySelector('#products');
const f={id:document.querySelector('#product-id'),name:document.querySelector('#name'),category:document.querySelector('#category'),price:document.querySelector('#price'),stock:document.querySelector('#stock'),unit:document.querySelector('#unit'),available:document.querySelector('#available'),description:document.querySelector('#description'),image:document.querySelector('#image')};
function say(text,error=false){message.className='notice'+(error?' error':'');message.textContent=text}
function reset(){form.reset();f.id.value='';document.querySelector('#save-button').textContent='Add vegetable';document.querySelector('#cancel-edit').hidden=true}
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){try{const d=await api('/api/admin/products');list.replaceChildren();if(!d.products.length){const e=document.createElement('div');e.className='empty';e.textContent='No products yet. Add your first vegetable above.';list.append(e);return}for(const p of d.products){const row=document.createElement('div');row.className='product';const info=document.createElement('div'),title=document.createElement('strong'),details=document.createElement('small');title.textContent=p.name;details.textContent='₹'+(p.price_paise/100).toFixed(2)+' / '+p.unit+' · Stock: '+p.stock_quantity+' · '+p.category+' · '+(p.is_available?'Available':'Hidden');info.append(title,details);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='btn secondary';edit.type='button';edit.textContent='Edit';edit.onclick=()=>{f.id.value=p.id;f.name.value=p.name;f.category.value=p.category;f.price.value=(p.price_paise/100).toFixed(2);f.stock.value=p.stock_quantity;f.unit.value=p.unit;f.available.value=String(Boolean(p.is_available));f.description.value=p.description||'';f.image.value=p.image_url||'';document.querySelector('#save-button').textContent='Save changes';document.querySelector('#cancel-edit').hidden=false;form.scrollIntoView({behavior:'smooth'})};const del=document.createElement('button');del.className='btn danger';del.type='button';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete '+p.name+'? This cannot be undone.'))return;try{await api('/api/admin/products/'+p.id,{method:'DELETE'});say(p.name+' deleted.');await load()}catch(e){say(e.message,true)}};actions.append(edit,del);row.append(info,actions);list.append(row)}}catch(e){list.replaceChildren();const err=document.createElement('div');err.className='notice error';err.textContent=e.message;list.append(err)}}
form.addEventListener('submit',async e=>{e.preventDefault();const id=f.id.value,p={name:f.name.value.trim(),category:f.category.value,price_rupees:Number(f.price.value),stock_quantity:Number(f.stock.value),unit:f.unit.value,is_available:f.available.value==='true',description:f.description.value.trim(),image_url:f.image.value.trim()};try{await api(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',body:JSON.stringify(p)});say(id?'Product updated successfully.':'Vegetable added successfully.');reset();await load()}catch(err){say(err.message,true)}});
document.querySelector('#cancel-edit').onclick=reset;load();
</script>
{% endif %}</div></body></html>
