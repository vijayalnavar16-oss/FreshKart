<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshKart - Language Selection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <div class="header-title">
            <span>←</span>
            <span>ಭಾಷೆ ಆಯ್ಕೆ (Select Language)</span>
        </div>
    </div>

    <div class="app-content">
        <form id="lang-form">
            <div class="card" style="display: flex; flex-direction: column; gap: 16px;">
                <label style="display: flex; align-items: center; gap: 12px; font-size: 16px; cursor: pointer;">
                    <input type="radio" name="language" value="kn" checked style="accent-color: #238636; width: 18px; height: 18px;">
                    <span>🇮🇳 ಕನ್ನಡ (Kannada - Default)</span>
                </label>
                <label style="display: flex; align-items: center; gap: 12px; font-size: 16px; cursor: pointer;">
                    <input type="radio" name="language" value="en" style="accent-color: #238636; width: 18px; height: 18px;">
                    <span>🇬🇧 English</span>
                </label>
                <label style="display: flex; align-items: center; gap: 12px; font-size: 16px; cursor: pointer;">
                    <input type="radio" name="language" value="hi" style="accent-color: #238636; width: 18px; height: 18px;">
                    <span>🇮🇳 हिन्दी (Hindi)</span>
                </label>
            </div>
            <button type="submit" class="btn-primary" style="margin-top: 20px;">ಸೇವ್ ಮಾಡಿ (Save)</button>
        </form>
    </div>
</div>

<script>
document.getElementById('lang-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const selectedLang = document.querySelector('input[name="language"]:checked').value;
    localStorage.setItem('freshkart_lang', selectedLang);
    window.location.href = '/login';
});
</script>
</body>
</html>
