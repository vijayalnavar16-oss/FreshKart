{% extends "base.html" %}
{% block content %}
<section class="card">
  <div class="head">
    <h1>Notifications</h1>
    {% if notification_count %}
    <form method="post" action="{{ url_for('mark_notifications_read') }}">
      <button class="btn small" type="submit">Mark all as read</button>
    </form>
    {% endif %}
  </div>
  {% for item in notifications %}
  <article class="notification{% if not item['read_at'] %} unread{% endif %}">
    <p>{{ item['message'] }}</p>
    <small class="muted">{{ item['created_at'] }}</small>
  </article>
  {% else %}
  <p class="muted">No notifications yet.</p>
  {% endfor %}
</section>
{% endblock %}
