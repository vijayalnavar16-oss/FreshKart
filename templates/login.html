
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshKart Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f8f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            color: #238636;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #b42318;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #238636;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">FreshKart</div>

    <h2>Login to your account</h2>

    <form id="login-form">

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            name="username"
            required
            autocomplete="username"
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
        >

        <button type="submit" id="login-button">
            Login
        </button>

        <p id="message"></p>

    </form>

    <div class="back">
        <a href="/">Back to FreshKart</a>
    </div>

</div>

<script>

const loginForm = document.getElementById("login-form");

const loginButton = document.getElementById("login-button");

const message = document.getElementById("message");


loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const username = document
        .getElementById("username")
        .value
        .trim();

    const password = document
        .getElementById("password")
        .value;

    message.textContent = "";

    loginButton.disabled = true;

    loginButton.textContent = "Logging in...";

    try {

        const response = await fetch(
            "https://freshkart-j9d1.onrender.com/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {

            message.textContent =
                data.message || "Login failed";

            return;
        }

        if (data.user.role === "admin") {

            window.location.href = "/admin.html";

        } else if (data.user.role === "farmer") {

            window.location.href = "/farmer.html";

        } else if (data.user.role === "customer") {

            window.location.href = "/customer.html";

        } else {

            message.textContent = "Invalid account role";

        }

    } catch (error) {

        console.error("Login error:", error);

        message.textContent =
            "Unable to connect to FreshKart. Please try again.";

    } finally {

        loginButton.disabled = false;

        loginButton.textContent = "Login";

    }

});

</script>

</body>
</html>
