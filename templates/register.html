
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshKart | Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f8f1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            color: #218838;
            font-size: 32px;
        }

        .logo p {
            color: #777;
            margin-top: 8px;
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #218838;
            text-decoration: none;
            font-size: 14px;
        }

        h2 {
            color: #263b2b;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #218838;
            box-shadow: 0 0 0 2px rgba(33, 136, 56, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #218838;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #17692a;
        }

        button:disabled {
            background: #9bbda3;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }

        .login {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .login a {
            color: #218838;
            text-decoration: none;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/" class="back">← Back to FreshKart</a>

    <div class="logo">
        <h1>🥬 FreshKart</h1>
        <p>Fresh vegetables directly from farmers</p>
    </div>

    <h2>Create Account</h2>

    <p class="subtitle">
        Join FreshKart as a customer or farmer
    </p>

    <form id="registerForm">

        <label for="role">Account Type</label>

        <select id="role" required>
            <option value="customer">Customer</option>
            <option value="farmer">Farmer</option>
        </select>

        <label for="name">Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
        >

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            placeholder="Create a username"
            autocomplete="username"
            minlength="3"
            maxlength="30"
            required
        >

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label for="phone">Mobile Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter 10-digit mobile number"
            autocomplete="tel"
            pattern="[0-9]{10}"
            maxlength="10"
            required
        >

        <label for="address">Address</label>

        <input
            type="text"
            id="address"
            placeholder="Enter your delivery address"
            autocomplete="street-address"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <label for="confirmPassword">Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Enter password again"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <button type="submit" id="registerButton">
            Create Account
        </button>

        <p id="message"></p>

    </form>

    <div class="login">
        Already have an account?
        <a href="/login">Login</a>
    </div>

    <div class="footer">
        © 2026 FreshKart | Farmer to Customer
    </div>

</div>

<script>
    const registerForm =
        document.getElementById("registerForm");

    const message =
        document.getElementById("message");

    const registerButton =
        document.getElementById("registerButton");

    registerForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const username =
            document.getElementById("username").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const address =
            document.getElementById("address").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const role =
            document.getElementById("role").value;

        if (password !== confirmPassword) {

            message.textContent = "Passwords do not match.";
            message.style.color = "red";

            return;
        }

        if (!/^[0-9]{10}$/.test(phone)) {

            message.textContent =
                "Enter a valid 10-digit mobile number.";

            message.style.color = "red";

            return;
        }

        message.textContent = "Creating your account...";
        message.style.color = "#666";

        registerButton.disabled = true;
        registerButton.textContent = "Please wait...";

        try {

            const response = await fetch("/api/register", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: name,
                    username: username,
                    email: email,
                    phone: phone,
                    address: address,
                    password: password,
                    role: role

                })

            });

            const data = await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error || "Registration failed."
                );

            }

            message.textContent =
                "Account created successfully! Redirecting to login...";

            message.style.color = "green";

            registerButton.textContent = "Account Created";

            setTimeout(function() {

                window.location.href = "/login";

            }, 1200);

        } catch (error) {

            message.textContent =
                error.message || "Unable to connect to server.";

            message.style.color = "red";

        } finally {

            registerButton.disabled = false;

            if (message.style.color !== "green") {
                registerButton.textContent = "Create Account";
            }

        }

    });
</script>

</body>
</html>
