{% extends "base.html" %}
{% block content %}
{% set v = form or product %}
<section class="card">
  <h1>{{ 'Edit vegetable' if product else 'Add vegetable' }}</h1>
  <form method="post" enctype="multipart/form-data" class="grid-form">
    <label>Name
      <input name="name" required maxlength="80" value="{{ v['name'] if v else '' }}">
    </label>
    <label>Category
      <select name="category" required>
        {% for c in categories %}
          <option value="{{ c }}" {{ 'selected' if v and v['category'] == c }}>{{ c }}</option>
        {% endfor %}
      </select>
    </label>
    {% if farmers and not product %}
    <label>Farmer
      <select name="farmer_id" required>
        <option value="">Choose a farmer</option>
        {% for f in farmers %}
          <option value="{{ f['id'] }}" {{ 'selected' if form and form.get('farmer_id') == f['id']|string }}>{{ f['full_name'] }}</option>
        {% endfor %}
      </select>
    </label>
    {% endif %}
    <label>Unit (for example kg, bunch, piece)
      <input name="unit" required maxlength="20" value="{{ v['unit'] if v else '' }}">
    </label>
    <label>Price (₹)
      <input type="number" name="price" required min="0.01" max="100000" step="0.01" value="{{ v['price'] if v else '' }}">
    </label>
    <label>Stock available
      <input type="number" name="stock" required min="0" max="100000" step="1" value="{{ v['stock'] if v else '0' }}">
    </label>
    <label>Description
      <textarea name="description" rows="3" maxlength="500">{{ v['description'] if v else '' }}</textarea>
    </label>
    <label>Photo (JPG, PNG or WebP, max 2 MB)
      <input type="file" name="image" accept="image/jpeg,image/png,image/webp">
      {% if product and product['image'] %}
        <img class="current-img" src="{{ url_for('static', filename='uploads/' ~ product['image']) }}" alt="Current photo">
        <span class="muted">Upload a new photo to replace it.</span>
      {% endif %}
    </label>
    <div class="actions-cell">
      <button class="btn" type="submit">Save</button>
      <a class="btn small" href="{{ url_for('products.manage') }}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
